<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股 RS 90+ 量化系統與模擬基金</title>

    <style>
        :root { --bg-color: #0b0e14; --card-bg: #151922; --text-main: #ffffff; --text-muted: #848e9c; --accent-green: #0ecb81; --accent-blue: #2962ff; --accent-orange: #f6465d; --border-color: #2a2e39; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 15px; }
        
        /* 導航與分頁設計 */
        .nav-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .tab-btn.active { color: var(--text-main); border-bottom: 3px solid var(--accent-blue); }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* 戰情室排版 */
        .container { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        .sidebar { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; height: 850px; overflow-y: auto; }
        .chart-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        #tradingview_widget { height: 450px; width: 100%; border-radius: 8px; overflow: hidden; margin-top: 15px;}
        
        .stock-item { background-color: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; }
        .stock-item.active { border-color: var(--accent-green); background-color: rgba(14, 203, 129, 0.05); }
        .stock-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
        
        /* 專家策略面板 UI */
        .strategy-panel { background: rgba(41, 98, 255, 0.05); border: 1px solid rgba(41, 98, 255, 0.2); border-radius: 10px; padding: 20px; margin-top: 20px; }
        .strategy-title { font-size: 16px; font-weight: bold; color: #64b5f6; margin-bottom: 15px; border-bottom: 1px dashed rgba(41, 98, 255, 0.3); padding-bottom: 8px;}
        .trade-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px;}
        @media (max-width: 768px) { .trade-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 480px) { .trade-grid { grid-template-columns: repeat(2, 1fr); } }

        .trade-label { font-size: 11px; color: #848e9c; margin-bottom: 5px; white-space: nowrap;}
        .trade-val.entry { color: #0ecb81; font-size: 18px; font-weight: bold; }
        .trade-val.stop { color: #f6465d; font-size: 18px; font-weight: bold; }
        .trade-val.target { color: #f5b041; font-size: 18px; font-weight: bold; }
        .strategy-text { display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 13px; color: #d1d4dc; line-height: 1.6; }
        .plan-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent-blue);}
        .plan-box.warning { border-left-color: var(--accent-orange); }

        .plan-box p { margin: 0; white-space: pre-line;}
