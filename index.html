<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股 RS 90+ 專業量化戰情室</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #151922; --text-main: #ffffff; --text-muted: #848e9c; --accent-green: #0ecb81; --accent-blue: #2962ff; --border-color: #2a2e39; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        .sidebar { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; height: 800px; overflow-y: auto; }
        .category-title { font-size: 16px; color: var(--accent-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 20px; }
        .stock-item { background-color: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; margin-top:10px; }
        .stock-item:hover, .stock-item.active { border-color: var(--accent-green); background-color: rgba(14, 203, 129, 0.05); }
        .stock-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .rs-score { color: var(--accent-green); }
        .stock-details { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        .chart-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        #tradingview_widget { height: 650px; width: 100%; }
        .error-msg { color: #ff5252; padding: 20px; text-align: center; border: 1px solid #ff5252; border-radius: 8px; background: rgba(255,82,82,0.1); }
    </style>
</head>
<body>
    <header>
        <h1>📉 RS 90+ 戰情室 (週線趨勢/日線 VCP)</h1>
    </header>
    <div class="container">
        <div class="sidebar">
            <h3 style="margin-top:0;">今日掃描結果</h3>
            <div id="stockList">載入中...</div>
        </div>
        <div class="main-content">
            <div class="chart-card">
                <h3 id="chartTitle">請選擇左側股票</h3>
                <div id="tradingview_widget"></div>
                <p id="valNotes" style="margin-top: 15px; font-size: 14px; color: #d1d4dc;"></p>
            </div>
        </div>
    </div>

    <script>
        async function loadStockData() {
            try {
                // 加入時間戳防止手機瀏覽器快取舊資料
                const response = await fetch('stocks_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                renderStockList(data.stocks);
            } catch (error) {
                console.error('載入失敗:', error);
                // 絕對不再放假數據！直接顯示錯誤，強迫我們檢查 GitHub Actions
                document.getElementById('stockList').innerHTML = '<div class="error-msg">⚠️ 讀取不到真實數據檔案。<br>這代表 GitHub Actions 跑完後沒有把 stocks_data.json 儲存到網頁空間。請執行第三步的 YAML 修改！</div>';
            }
        }

        function renderStockList(stocks) {
            const listEl = document.getElementById('stockList');
            listEl.innerHTML = '';
            
            const vcpStocks = stocks.filter(s => s.category === "VCP突破組");
            const leaderStocks = stocks.filter(s => s.category === "行業潛水龍頭");

            let html = '';
            if (vcpStocks.length > 0) {
                html += `<div class="category-title">🎯 嚴格 VCP 突破組 (${vcpStocks.length})</div>`;
                vcpStocks.forEach(s => html += createStockCard(s));
            } else {
                html += `<div class="category-title">🎯 嚴格 VCP 突破組 (0)</div><p style="color:#848e9c; font-size:13px;">今日無股票符合完美收縮，寧缺勿濫。</p>`;
            }

            if (leaderStocks.length > 0) {
                html += `<div class="category-title">🌊 各行業潛水龍頭 (${leaderStocks.length})</div>`;
                leaderStocks.forEach(s => html += createStockCard(s));
            }
            
            listEl.innerHTML = html;
            if (stocks.length > 0) selectStock(stocks[0]);
        }

        function createStockCard(stock) {
            return `
                <div class="stock-item" onclick='selectStock(${JSON.stringify(stock)})'>
                    <div class="stock-header"><span>${stock.ticker}</span><span class="rs-score">RS: ${stock.rs}</span></div>
                    <div class="stock-details">板塊: ${stock.sector}<br>狀態: ${stock.status}</div>
                </div>`;
        }

        function selectStock(stock) {
            document.getElementById('chartTitle').innerText = `${stock.ticker} - 專業技術圖表`;
            document.getElementById('valNotes').innerHTML = `💡 <b>戰略筆記：</b> ${stock.status}。`;
            document.getElementById('tradingview_widget').innerHTML = '';
            new TradingView.widget({
                "width": "100%", "height": 650, "symbol": stock.ticker, "interval": "W", // 預設顯示週線看大趨勢
                "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "zh_HK", "toolbar_bg": "#f1f3f6",
                "enable_publishing": false, "allow_symbol_change": true, "container_id": "tradingview_widget"
            });
        }

        loadStockData();
    </script>
</body>
</html>
