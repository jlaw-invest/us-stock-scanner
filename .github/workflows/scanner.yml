name: Daily US Stock Scanner & Paper Trader Auto Update

on:
  schedule:
    # 涵蓋香港時間下午 4:30、4:40、4:50 (對應 UTC 08:30, 08:40, 08:50)，週一至週五
    - cron: '30,40,50 8 * * 1-5'
    # 涵蓋香港時間下午 5:00 至翌日清晨 5:50 (對應 UTC 09:00 至 21:50)，每 10 分鐘一次，週一至週五
    - cron: '*/10 9-21 * * 1-5'
  workflow_dispatch: # 保留手動執行按鈕，方便隨時測試

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 確保拉取完整歷史，避免 rebase 發生衝突

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 支援 requirements.txt，同時直接確保安裝最新依賴防止漏裝
          pip install pandas yfinance numpy requests scipy

      - name: Run Stock Scanner (實時選股器)
        run: python stock_scanner.py

      - name: Run Paper Trader (實時模擬交易員)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python paper_trader.py

      - name: Commit and Push changes (自動提交與發布)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 【智能防護】：檢查是否有實質數據變動
          git add stocks_data.json portfolio.json || git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data: Scanner & Paper Trader"
            # 【防撞車機制】：上傳前先同步遠端最新修改，防止多人或網頁版撞車
            git pull --rebase origin main
            git push
          fi
