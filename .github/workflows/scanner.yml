name: Daily US Stock Scanner & Paper Trader Auto Update

on:
  schedule:
    # 港股時間晚上 9 點至翌日清晨 5 點，每小時的 0 分執行一次 (即美股盤中每小時更新)
    - cron: '0 13-21 * * 1-5'
    # 收市後進行最後一次終極盤點 (香港時間早上 6 點 / UTC 22:00)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 【新增】防重疊機制：如果上一個 Action 未跑完，新的 Action 會排隊，絕對唔會撞車！
concurrency:
  group: market-data-update
  cancel-in-progress: false 

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance numpy requests scipy

      - name: Run Stock Scanner (實時選股器)
        run: python stock_scanner.py

      - name: Run Paper Trader (實時模擬交易員)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python paper_trader.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add stocks_data.json portfolio.json || git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data: Scanner & Paper Trader"
            git pull --rebase origin main
            git push
          fi
